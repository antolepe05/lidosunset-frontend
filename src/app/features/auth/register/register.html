<div class="login-container">
  <div class="login-card">
    <h1>🌅 Lido Sunset</h1>
    <h2>Registrati</h2>

    <form #registerForm="ngForm" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input id="nome" type="text" [(ngModel)]="request.nome" name="nome" required />
        </div>

        <div class="form-group">
          <label for="cognome">Cognome</label>
          <input id="cognome" type="text" [(ngModel)]="request.cognome" name="cognome" required />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="request.email" name="email" required />
      </div>

      <div class="form-group">
        <label for="telefono">Telefono (opzionale)</label>
        <input id="telefono" type="text" [(ngModel)]="request.telefono" name="telefono" />
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" [(ngModel)]="request.username" name="username" placeholder="Scegli uno username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="request.password" name="password" placeholder="Scegli una password" required />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading || registerForm.invalid">
        {{ isLoading ? 'Registrazione in corso...' : 'Registrati' }}
      </button>
    </form>

    <p class="register-link">
      Hai già un account? <a routerLink="/login">Accedi</a>
    </p>
  </div>
</div>
