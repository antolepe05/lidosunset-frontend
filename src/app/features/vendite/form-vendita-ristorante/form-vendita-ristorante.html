<div class="page-container">

  <div class="page-header">
    <button class="back-btn" (click)="goBack()">← Vendite Ristorante</button>
    <h1>{{ isEditMode ? '✏️ Modifica Vendita' : '➕ Nuova Vendita' }}</h1>
  </div>

  <div *ngIf="isLoading" class="loading">Caricamento...</div>

  <form *ngIf="!isLoading" #venditaForm="ngForm" (ngSubmit)="onSubmit()" class="form-card">

    <div class="form-row">
      <div class="form-group">
        <label for="data">Data</label>
        <input id="data" type="date" [(ngModel)]="vendita.data" name="data" required />
      </div>

      <div class="form-group">
        <label for="totale">Totale incassato (€)</label>
        <input id="totale" type="number" step="0.01" min="0" [(ngModel)]="vendita.totale" name="totale" required />
      </div>
    </div>

    <div class="form-group">
      <label for="note">Note (opzionale)</label>
      <textarea id="note" [(ngModel)]="vendita.note" name="note" rows="3"></textarea>
    </div>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" class="submit-btn" [disabled]="venditaForm.invalid">
      {{ isEditMode ? 'Salva Modifiche' : 'Registra Vendita' }}
    </button>
  </form>

</div>
